site_name: FinAuto Help
site_description: User guide for FinAuto Client — matches the app menu
site_url: https://finautoindia.github.io/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  language: en
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - header.autohide
    - toc.follow
  palette:
    # Light-first (screenshots / brand); user can still switch to dark
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/finauto-theme.css
  - https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css

extra_javascript:
  - javascripts/finauto-docs.js

extra:
  generator: false

hooks:
  - scripts/build_corpus.py

